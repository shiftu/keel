version: 1
tools:
  - claude
  - codex
workflow:
  default_level: 1
  auto_promote: false
  actions:
    data.delete: 0
    dependency.add: 1
    public-api.change: 0
    security: 0
  paths: {}
brief:
  max_bytes: 16384
  max_decisions: 8
  max_notes: 8
gate:
  require_trailer: false
  manifests:
    - go.mod
    - package.json
    - pyproject.toml
    - Cargo.toml
    - requirements*.txt
  watch_top_level_dirs: true
sync:
  commit_outputs: true
  skills_mode: copy
mcp:
  servers: {}
knowledge:
  docs:
    - README.md
    - docs/**/*.md
  exclude: []
  index_history: false      # 历史结论在索引里只出计数；true 展开成清单
  index_soft_limit: 200     # 现行对象超过它，review 报 index_pressure；0 关闭
